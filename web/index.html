<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>ドット絵ステガノグラフィー</title>
  <meta name="description" content="ドット絵の同じ色の領域の境界に、見た目を保ったまま文字列を埋め込み、取り出せます。処理はすべてブラウザの中で行います。">
  <!-- リンクのカード（Slack・X など。OGP と Twitter Card）。読む側は head の先頭から読むので早めに置く。URL は公開の入口の絶対 URL。
       画像は public/og.png（1200×630。scripts/og-image.mjs で作る）。文言を変えたら scripts/og-image.mjs の CARD も合わせる -->
  <link rel="canonical" href="https://sagisawa.0am.jp/stegano/">
  <meta property="og:site_name" content="sagisawa">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="ドット絵ステガノグラフィー">
  <meta property="og:description" content="ドット絵の同じ色の領域の境界に、見た目を保ったまま文字列を埋め込み、取り出せます。処理はすべてブラウザの中で行います。">
  <meta property="og:url" content="https://sagisawa.0am.jp/stegano/">
  <meta property="og:image" content="https://sagisawa.0am.jp/stegano/og.png">
  <meta property="og:image:secure_url" content="https://sagisawa.0am.jp/stegano/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ドット絵ステガノグラフィーの画面: ドット絵に文字列を埋め込んだ結果">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ドット絵ステガノグラフィー">
  <meta name="twitter:description" content="ドット絵の同じ色の領域の境界に、見た目を保ったまま文字列を埋め込み、取り出せます。処理はすべてブラウザの中で行います。">
  <meta name="twitter:image" content="https://sagisawa.0am.jp/stegano/og.png">
  <meta name="twitter:image:alt" content="ドット絵ステガノグラフィーの画面: ドット絵に文字列を埋め込んだ結果">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0e1419">
  <!-- sagisawa と同じアイコン（Muratam/sagisawa の portal/app/src/app/icon.svg・apple-icon.png） -->
  <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="%BASE_URL%apple-icon.png">
  <style>html,body{background:#0e1419;color:#e3eaef}</style>
</head>

<body>
  <noscript>
    <p>このツールには JavaScript が必要です。ブラウザの設定で JavaScript を有効にしてから、ページを開き直してください。</p>
  </noscript>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
